spring.application.name=ecommerce-backend

# Configuracion local de PostgreSQL para la prueba tecnica.
# DB_PASSWORD es opcional: se conserva root como valor academico por defecto.
# No utilizar estos valores en un entorno productivo.
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# El esquema se gestionara mediante los scripts versionados del directorio database.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Inicializacion idempotente desde los scripts versionados del monorepo.
spring.sql.init.mode=always
spring.sql.init.schema-locations=optional:file:database/schema.sql
spring.sql.init.data-locations=optional:file:database/data.sql

# Origen permitido para el frontend Angular durante el desarrollo local.
app.cors.allowed-origins=http://localhost:4200
