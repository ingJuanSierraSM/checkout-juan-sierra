spring.application.name=ecommerce-backend

# Configuracion local de PostgreSQL para la prueba tecnica.
# No utilizar estos valores en un entorno productivo.
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# El esquema se gestionara mediante los scripts versionados del directorio database.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Origen permitido para el frontend Angular durante el desarrollo local.
app.cors.allowed-origins=http://localhost:4200
